# Fly.io deployment for the Verdix static SPA (built by the Dockerfile, served by Caddy).
app = "verdix-elections"
primary_region = "sin"   # Singapore — close to India (Mumbai/bom was at capacity)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
