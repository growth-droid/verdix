# Netlify build + deploy config for the Verdix Vite SPA.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page-app fallback: react-router owns client-side routing, so every path
# that isn't a real static file must serve index.html (a refresh / deep-link to
# /state, /compare, /story, etc. would otherwise 404). Real files (assets, /data,
# /geo) are served directly and are NOT caught by this. Keep it LAST among redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security + anti-scrape headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"                          # block embedding our UI in another site (clickjacking / iframe data-lift)
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    X-Robots-Tag = "noindex, nofollow"                # shareable by link, but kept out of search-engine indexes
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"   # force HTTPS for 2y
    # Strict Content-Security-Policy: ONLY our own origin can run scripts — any injected/XSS <script>
    # is refused by the browser. Styles allow inline (React/ECharts) + Google Fonts; map workers need
    # blob:; everything else is 'self'. All data/JS is same-origin, so nothing external is trusted.
    # ⚠ WHEN YOU RE-ENABLE GOOGLE SIGN-IN (config.ts AUTH_ENABLED=true), append to this policy:
    #   connect-src … https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseio.com
    #   frame-src https://verdix-d369c.firebaseapp.com
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests"

# Data + geometry endpoints: not indexable, and only our own origin may read them in a browser (CORS).
# Long-cache immutable build artifacts (filenames are content-hashed, so they change when content
# does). Netlify's default is max-age=0/must-revalidate, which forces a round-trip per asset every
# load — these never need that. (index.html is NOT hashed, so it keeps the default and picks up deploys.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/glyphs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Access-Control-Allow-Origin = "https://verdix-elections.netlify.app"
    Cache-Control = "public, max-age=3600"

# Boundary geometry is large (~12 MB AC set) and effectively never changes — cache it a day so
# revisits don't re-fetch it.
[[headers]]
  for = "/geo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Access-Control-Allow-Origin = "https://verdix-elections.netlify.app"
    Cache-Control = "public, max-age=86400"
